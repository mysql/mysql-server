name: PR Build
on:
  pull_request:
    branches: [trunk]
    paths-ignore: ["Docs/**", "**/*.md"]

permissions: {}

# Cancel superseded runs so a fast push doesn't queue behind a stale build.
concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug build (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          path: source
      - name: Check out trusted CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci
          path: trusted
      - name: Verify PR merge commit
        working-directory: source
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          test "$(git -C ../trusted rev-parse HEAD)" = "$EXPECTED_BASE"
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      # Fork revisions can poison PR-scoped caches. Restore only for trusted,
      # same-repository branches, and never save data from this PR workflow.
      - name: Restore Boost cache
        if: ${{ github.event.pull_request.head.repo.id == github.event.repository.id }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mysql-boost
          key: boost-${{ hashFiles('source/cmake/boost.cmake') }}
      - name: Restore ccache
        if: ${{ github.event.pull_request.head.repo.id == github.event.repository.id }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ github.event.pull_request.head.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-
      - name: Show runner resources
        working-directory: source
        run: |
          echo "CPU cores: $(nproc)"
          free -h
          df -h .
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
      - name: Show ccache stats
        if: always()
        working-directory: source
        run: ccache --show-stats
