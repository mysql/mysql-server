name: Format Check
on:
  pull_request:
    branches: [trunk]
    paths:
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - ".clang-format"

permissions: {}

concurrency:
  group: format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          path: source
      - name: Verify PR merge commit
        working-directory: source
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      # Uses the repository's existing .clang-format — no style is redefined here.
      - name: Check formatting of changed files
        working-directory: source
        run: |
          if ! git diff --quiet --no-ext-diff --no-textconv HEAD^1 HEAD -- \
            '.clang-format'; then
            echo "::error::The repository formatting policy requires trusted review."
            exit 1
          fi

          changed_files="$RUNNER_TEMP/clang-format-files"
          git diff --name-only -z --diff-filter=ACMR \
            --no-ext-diff --no-textconv HEAD^1 HEAD -- \
            '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' > "$changed_files"

          found=0
          fail=0
          while IFS= read -r -d '' file; do
            found=1
            [ -f "$file" ] || continue
            if ! clang-format-18 --style=file --dry-run --Werror -- "$file"; then
              fail=1
            fi
          done < "$changed_files"

          if [ "$found" -eq 0 ]; then
            echo "No C/C++ changes."
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Run scripts/ci/format.sh to fix formatting."
            exit 1
          fi
