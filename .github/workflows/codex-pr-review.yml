name: Codex PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [trunk]

permissions: {}

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex:
    # This job uses an API secret, so only trusted repository actors may run it.
    if: >-
      github.event.pull_request.draft == false &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      review_b64: ${{ steps.run_review.outputs.review_b64 }}
    steps:
      - name: Verify PR author can write
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const username = context.payload.pull_request.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              throw new Error(`@${username} does not have write permission`);
            }

      - name: Check out PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
          path: source

      - name: Verify PR merge commit
        working-directory: source
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"

      - name: Check out trusted review client
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci/codex_pr_review.py
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Verify trusted review client
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE"

      - name: Review pull request
        id: run_review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.6-sol' }}
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
        run: >-
          python3 "$GITHUB_WORKSPACE/trusted/scripts/ci/codex_pr_review.py"
          --source "$GITHUB_WORKSPACE/source"

  post_feedback:
    runs-on: ubuntu-24.04
    needs: codex
    if: >-
      needs.codex.result == 'success' &&
      needs.codex.outputs.review_b64 != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post Codex feedback
        uses: actions/github-script@v7
        env:
          REVIEW_B64: ${{ needs.codex.outputs.review_b64 }}
        with:
          github-token: ${{ github.token }}
          script: |
            const encoded = process.env.REVIEW_B64 || '';
            const base64 = /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/;
            if (!encoded || !base64.test(encoded)) {
              throw new Error('Review output is not canonical base64');
            }
            const decoded = Buffer.from(encoded, 'base64');
            if (decoded.length === 0 || decoded.length > 48 * 1024) {
              throw new Error('Review output is empty or too large');
            }
            if (decoded.toString('base64') !== encoded) {
              throw new Error('Review output failed base64 validation');
            }
            const body = decoded.toString('utf8');
            if (!Buffer.from(body, 'utf8').equals(decoded)) {
              throw new Error('Review output is not valid UTF-8');
            }
            const safeBody = body.replace(/@(?=[A-Za-z0-9_-])/g, '@\u200b');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '<!-- repository-owned-code-review -->\n' + safeBody,
            });

  report:
    name: Report Codex result
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.draft == false &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    needs: [codex, post_feedback]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish Codex status on the PR head
        uses: actions/github-script@v7
        env:
          REVIEW_RESULT: ${{ needs.codex.result }}
          POST_RESULT: ${{ needs.post_feedback.result }}
        with:
          script: |
            const passed =
              process.env.REVIEW_RESULT === 'success' &&
              process.env.POST_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state: passed ? 'success' : 'failure',
              context: 'Codex PR Review',
              description: passed ? 'Automated review posted' : 'Automated review failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
