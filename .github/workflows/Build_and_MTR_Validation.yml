name: Build and test mysql-server PRs on Linux and Windows

on:
  pull_request:
    branches: [ "trunk" ]

jobs:
  linux-workflow:
    runs-on: ubuntu-latest
 
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v6
        with: 
          fetch-depth: 0

      - name: Dependency Installation
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libaio-dev \
            libcurl4-openssl-dev \
            libedit-dev \
            libevent-dev \
            libldap2-dev \
            libprotobuf-dev \
            libreadline-dev \
            libsasl2-dev \
            libtirpc-dev \
            libudev-dev \
            libxml2-utils \
            protobuf-compiler
            
      - name: File-Change Analysis
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          
          mapfile -t changed_files < <(
            git diff --name-only "$base_sha" "$head_sha" | sed '/^$/d'
          )
          echo "Changed files detected in PR:"
          if (( ${#changed_files[@]} == 0 )); then
            echo "(none)"
          else
            printf '%s\n' "${changed_files[@]}"
          fi
          
          hypergraph_re='^(sql/join_optimizer.*|sql/iterators.*|sql/range_optimizer.*|sql/sql_.*|sql/query_.*|sql/opt_.*|sql/window.*|sql/item.*|sql/handler.*|sql/histogram/.*)'
          innodb_re='^(storage/innobase/|mysql-test/suite/innodb)'
          
          enable_hypergraph=false
          build_debug_tree=false
          enable_ndb=false
          enable_extra_mtr=false
  
          if (( ${#changed_files[@]} > 0 )); then
            if printf '%s\n' "${changed_files[@]}" | grep -Eq "$hypergraph_re"; then
              enable_hypergraph=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Eq "$innodb_re"; then
              build_debug_tree=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Eq '(innobase|innodb)'; then
              enable_extra_mtr=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Eq '^(storage/ndb/|sql/dd/ndbinfo_schema|mysql-test/suite/.*ndb.*)'; then
              enable_ndb=true
            fi
          fi
          
          {
            echo "enable_hypergraph=$enable_hypergraph"
            echo "build_debug_tree=$build_debug_tree"
            echo "enable_ndb=$enable_ndb"
            echo "enable_extra_mtr=$enable_extra_mtr"
          } >> "$GITHUB_OUTPUT"
          
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          
          build_opts=""
          if [[ "${{ steps.diff.outputs.enable_ndb }}" == "true" ]]; then
            build_opts="$build_opts -DWITH_NDBCLUSTER=1"
          fi
          if [[ "${{ steps.diff.outputs.enable_hypergraph }}" == "true" ]]; then
            build_opts="$build_opts -DWITH_HYPERGRAPH_OPTIMIZER=ON"
          fi
          
          rm -rf "${GITHUB_WORKSPACE}/bld" "${GITHUB_WORKSPACE}/debug"
          mkdir -p bld
          cd bld
          echo "cmake .. $build_opts"
          cmake .. $build_opts
          make -j"$(nproc)"
          
          if [[ "${{ steps.diff.outputs.build_debug_tree }}" == "true" ]]; then
            cd "${GITHUB_WORKSPACE}"
            mkdir -p debug
            cd debug
            debug_opts="-DWITH_DEBUG=1 -DOPTIMIZE_DEBUG_BUILDS=1 $build_opts"
            echo "cmake .. $debug_opts"
            cmake .. $debug_opts
            make -j"$(nproc)"
          fi
          
      - name: Package Generation
        shell: bash
        run: |
          set -euo pipefail
          
          cd bld
          make package
          
      - name: Main MTR Validation
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          xml_report="${GITHUB_WORKSPACE}/mtr_${GITHUB_RUN_NUMBER}.xml"
          unit_report="${GITHUB_WORKSPACE}/mtr-unit_${GITHUB_RUN_NUMBER}.xml"
          summary_report="${GITHUB_WORKSPACE}/build-error_main_${GITHUB_RUN_NUMBER}.txt"
          
          if [ ! -d "${mysql_test_dir}" ]; then
            touch "${xml_report}"
            touch "${unit_report}"
            echo "skipped" > "${summary_report}"
            exit 0
          fi
          
          rm -rf /dev/shm/var_auto_*
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --nounit-tests \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --xml-report="${xml_report}" \
            --summary-report="${summary_report}"
            
          mtr_status=$?
          
          cd "${GITHUB_WORKSPACE}/bld"
          ctest -j "$(nproc)" --output-junit "${unit_report}"
          
          unit_status=$?
          
          exit $((mtr_status + unit_status))
          
      - name: Hypergraph Validation
        if: steps.diff.outputs.enable_hypergraph == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          hypergraph_report="${GITHUB_WORKSPACE}/hypergraph_${GITHUB_RUN_NUMBER}.txt"
          
          rm -rf /dev/shm/var_auto_* || true
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --nounit-tests \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --summary-report="${hypergraph_report}" \
            --hypergraph \
            --skip-ndb \
            --skip-suite=rapid
          
      - name: Additional InnoDB Validation
        if: steps.diff.outputs.enable_extra_mtr == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          extra_report="${GITHUB_WORKSPACE}/extra_suites_${GITHUB_RUN_NUMBER}.txt"
          extra_suites=(innodb_fts innodb_undo innodb_gis innodb_zip)
          
          rm -rf /dev/shm/var_auto_* || true
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --summary-report="${extra_report}" \
            --suite="$(IFS=,; echo "${extra_suites[*]}")"
      
      - name: Debug Validation
        if: steps.diff.outputs.build_debug_tree == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          
          debug_test_dir="${GITHUB_WORKSPACE}/debug/mysql-test"
          debug_xml_report="${GITHUB_WORKSPACE}/mtr-debug_${GITHUB_RUN_NUMBER}.xml"
          debug_summary_report="${GITHUB_WORKSPACE}/build-error_debug_${GITHUB_RUN_NUMBER}.txt"
          debug_err_log="${GITHUB_WORKSPACE}/mtr_${GITHUB_RUN_NUMBER}.err"
          
          rm -rf /dev/shm/var_auto_*
          cd "${debug_test_dir}"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --xml-report="${debug_xml_report}" \
            --summary-report="${debug_summary_report}" \
            --parallel "$(nproc)" \
            2>&1 | tee "${debug_err_log}"
            
      - name: Replication Validation
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          repl_report="${GITHUB_WORKSPACE}/mtr-replication_${GITHUB_RUN_NUMBER}.xml"
          repl_summary="${GITHUB_WORKSPACE}/build-error_replication_${GITHUB_RUN_NUMBER}.txt"
          
          rm -rf /dev/shm/var_auto_* || true
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --xml-report="${repl_report}" \
            --summary-report="${repl_summary}" \
            --parallel "$(nproc)" \
            --comment=group_replication \
            --suite=group_replication
            
      - name: XML Validation
        shell: bash
        run: |
          set -euo pipefail
          
          cd "${GITHUB_WORKSPACE}"
          find . -name 'mtr_*.xml' -size 0 -delete
          for f in mtr_*.xml; do
            [ -e "$f" ] || continue
            xmllint --noout "$f"
          done
          
      - name: Publish MTR Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          emit_mtr_stage() {
            local title="$1"
            local enabled="$2"
            local report="$3"
            local log="${4:-}"
            local content status total failed line

            if [[ "$enabled" != "true" ]]; then
              echo "- ${title}: Skipped"
              echo "   Not enabled for this PR"
              echo
              return
            fi

            if [[ ! -f "$report" ]]; then
              echo "X ${title}: Failed"
              echo "   No summary report produced"
              echo
              return
            fi

            content="$(cat "$report")"

            if grep -qi '^skipped$' <<<"$content"; then
              echo "- ${title}: Skipped"
              echo "   Report says skipped"
              echo
              return
            fi

            status="Failed"
            total=""
            failed=""

            if [[ "$content" =~ Completed:[[:space:]]*All[[:space:]]*([0-9]+)[[:space:]]*tests[[:space:]]*were[[:space:]]*successful\. ]]; then
              total="${BASH_REMATCH[1]}"
              failed="0"
              status="Completed"
            elif [[ "$content" =~ Failed[[:space:]]*([0-9]+)/([0-9]+)[[:space:]]*tests ]]; then
              failed="${BASH_REMATCH[1]}"
              total="${BASH_REMATCH[2]}"
              status="Completed"
            elif [[ -n "$log" && -f "$log" ]]; then
              line="$(grep -Eo 'Failed[[:space:]]*[0-9]+/[0-9]+[[:space:]]*tests' "$log" | tail -n 1 || true)"
              if [[ "$line" =~ Failed[[:space:]]*([0-9]+)/([0-9]+)[[:space:]]*tests ]]; then
                failed="${BASH_REMATCH[1]}"
                total="${BASH_REMATCH[2]}"
                status="Completed"
              fi
            fi

            if [[ "$status" == "Completed" ]]; then
              echo "* ${title}: Completed"
            else
              echo "X ${title}: Failed"
            fi
            [[ -n "$total" ]] && echo "   No of tests: ${total}"
            [[ -n "$failed" ]] && echo "   Failed: ${failed}"
            echo
          }

          emit_unit_stage() {
            local title="$1"
            local xml="$2"

            if [[ ! -f "$xml" ]]; then
              echo "X ${title}: Failed"
              echo "   No unit-test report produced"
              echo
              return
            fi

            if [[ ! -s "$xml" ]]; then
              echo "X ${title}: Failed"
              echo "   Empty unit-test report"
              echo
              return
            fi

            local tests failures skipped

            tests="$(xmllint --xpath 'string(//testsuites/@tests | //testsuite/@tests)' "$xml" 2>/dev/null || true)"
            failures="$(xmllint --xpath 'string(//testsuites/@failures | //testsuite/@failures)' "$xml" 2>/dev/null || true)"
                
            tests="${tests:-0}"
            failures="${failures:-0}"
         
            echo "* ${title}: Completed"
            echo "   No of tests: ${tests}"
            echo "   Failed: ${failures}"
            echo
          }

          {
            echo "## Linux Test Summary"
            echo
            emit_mtr_stage "Main MTR" "true" "${GITHUB_WORKSPACE}/build-error_main_${GITHUB_RUN_NUMBER}.txt"
            emit_unit_stage "Unit tests" "${GITHUB_WORKSPACE}/mtr-unit_${GITHUB_RUN_NUMBER}.xml"
            emit_mtr_stage "Hypergraph MTR" "${{ steps.diff.outputs.enable_hypergraph }}" "${GITHUB_WORKSPACE}/hypergraph_${GITHUB_RUN_NUMBER}.txt"
            emit_mtr_stage "Additional InnoDB MTR" "${{ steps.diff.outputs.enable_extra_mtr }}" "${GITHUB_WORKSPACE}/extra_suites_${GITHUB_RUN_NUMBER}.txt"
            emit_mtr_stage "Debug MTR" "${{ steps.diff.outputs.build_debug_tree }}" "${GITHUB_WORKSPACE}/build-error_debug_${GITHUB_RUN_NUMBER}.txt" "${GITHUB_WORKSPACE}/mtr_${GITHUB_RUN_NUMBER}.err"
            emit_mtr_stage "Replication MTR" "true" "${GITHUB_WORKSPACE}/build-error_replication_${GITHUB_RUN_NUMBER}.txt"
           } >> "$GITHUB_STEP_SUMMARY"
    
      - name: Artifact Organization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          
          rm -rf artifacts
          mkdir -p \
            artifacts/test-reports \
            artifacts/summaries \
            artifacts/logs \
            artifacts/packages
    
          shopt -s nullglob

          # Test reports
          cp -v mtr_*.xml artifacts/test-reports/ 2>/dev/null || true
          cp -v mtr-unit_*.xml artifacts/test-reports/ 2>/dev/null || true

          # Summaries
          cp -v build-error_main_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v build-error_debug_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v build-error_replication_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v extra_suites_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v hypergraph_*.txt artifacts/summaries/ 2>/dev/null || true

          # Logs
          cp -v mtr_*.err artifacts/logs/ 2>/dev/null || true

          # Packages
          find bld -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) \
            -exec cp -v {} artifacts/packages/ \; 2>/dev/null || true
          
      - name: Artifact Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-ci-artifacts
          if-no-files-found: ignore
          path: artifacts/   
          
  windows-workflow:
    runs-on: windows-latest

    steps:
      - name: Git Configuration
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --system core.longpaths true
          
      - name: Repository Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: File-Change Analysis
        id: diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          $baseSha = '${{ github.event.pull_request.base.sha }}'
          $headSha = '${{ github.event.pull_request.head.sha }}'
          
          $changedFiles = @(
            git diff --name-only $baseSha $headSha |
            Where-Object { $_ -and $_.Trim() }
          )
          Write-Host 'Changed files detected in PR:'
          if ($changedFiles.Count -eq 0) {
            Write-Host '(none)'
          }
          else {
            $changedFiles | ForEach-Object { Write-Host $_ }
          }
          
          $enable_innodb_mtr = $false
          if ($changedFiles.Count -gt 0) {
            if ($changedFiles | Where-Object { $_ -match '(^|/)(innodb|innobase)(/|$)' }) {
              $enable_innodb_mtr = $true
            }
          }
          @(
            "enable_innodb_mtr=$enable_innodb_mtr"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          
      - name: OpenSSL Installation
        id: openssl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          choco install openssl.light -y --no-progress
          $opensslDir = Get-ChildItem "C:\Program Files","C:\Program Files (x86)" -Directory -Filter "OpenSSL*" |
            Select-Object -First 1
          if ($null -eq $opensslDir) {
            throw "OpenSSL installation directory not found"
          }
          $opensslRoot = $opensslDir.FullName -replace '\\', '/'
          Write-Host "Using OpenSSL root: $opensslRoot"
          & "$($opensslDir.FullName)\bin\openssl.exe" version
          "openssl_root=$opensslRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          
      - name: Bison Installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          choco install winflexbison3 -y --no-progress
          where.exe win_bison
          win_bison --version
          
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          if (Test-Path bld) { Remove-Item -Recurse -Force bld }
          New-Item -ItemType Directory -Path bld | Out-Null
          Set-Location bld
          $cmake = 'C:\Program Files\CMake\bin\cmake.exe'
          $args = @(
            '-G', 'Visual Studio 17 2022'
            '-DWITH_BOOST=C:/boost'
            '-DWITH_SSL=${{ steps.openssl.outputs.openssl_root }}'
            '-DBISON_EXECUTABLE=C:/ProgramData/chocolatey/bin/win_bison.exe'
            '..'
          )
          & $cmake @args
          & $cmake --build . -- /m
          
      - name: Package Generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          Set-Location bld
          & 'C:\Program Files\CMake\bin\cmake.exe' --build . --target package -- /m
          
      - name: MTR Validation
        id: mtr
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          
          $mysqlTestDir = Join-Path $env:GITHUB_WORKSPACE 'bld\mysql-test'
          $vardir = Join-Path $env:RUNNER_TEMP 'var-dir'
          $summaryReport = Join-Path $env:GITHUB_WORKSPACE ("build-error_main_{0}.txt" -f $env:GITHUB_RUN_NUMBER)
          $xmlReport = Join-Path $env:GITHUB_WORKSPACE ("mtr_{0}.xml" -f $env:GITHUB_RUN_NUMBER)
          $errLog = Join-Path $env:GITHUB_WORKSPACE ("mtr_{0}.err" -f $env:GITHUB_RUN_NUMBER)
          
          if (Test-Path $vardir) {
            Remove-Item -Recurse -Force $vardir
          }
          New-Item -ItemType Directory -Path $vardir | Out-Null
          Set-Location $mysqlTestDir
          if ("${{ steps.diff.outputs.enable_innodb_mtr }}" -eq "true") {
            perl mysql-test-run.pl `
              --vardir="$vardir" `
              --force `
              --retry-failure=2 `
              --retry=2 `
              --max-test-fail=0 `
              --report-unstable-tests `
              --clean-vardir `
              --xml-report="$xmlReport" `
              --summary-report="$summaryReport" `
              --parallel=$env:NUMBER_OF_PROCESSORS `
              --suite=innodb `
              2>&1 | Tee-Object -FilePath $errLog
          }
          else {
            perl mysql-test-run.pl `
              --vardir="$vardir" `
              --force `
              --retry-failure=2 `
              --retry=2 `
              --max-test-fail=0 `
              --report-unstable-tests `
              --clean-vardir `
              --xml-report="$xmlReport" `
              --summary-report="$summaryReport" `
              --parallel=$env:NUMBER_OF_PROCESSORS `
              1st `
              2>&1 | Tee-Object -FilePath $errLog
          }

      - name: Publish MTR Summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = $env:GITHUB_WORKSPACE
          $reportPath = Join-Path $root ("build-error_main_{0}.txt" -f $env:GITHUB_RUN_NUMBER)
          $logPath = Join-Path $root ("mtr_{0}.err" -f $env:GITHUB_RUN_NUMBER)
          $suiteLabel = if ("${{ steps.diff.outputs.enable_innodb_mtr }}" -eq "true") { "innodb" } else { "1st" }

          function Get-MtrBlock {
            param(
              [string]$Title,
              [string]$Suite,
              [string]$ReportPath,
              [string]$LogPath
            )

            if (-not (Test-Path $ReportPath)) {
              return @(
                "X $Title ($Suite): Failed"
                "   No summary report produced"
                ""
              )
            }

            $content = Get-Content $ReportPath -Raw -ErrorAction SilentlyContinue
            if ([string]::IsNullOrWhiteSpace($content)) {
              return @(
                "X $Title ($Suite): Failed"
                "   Empty summary report"
                ""
              )
            }

            if ($content -match '^\s*skipped\s*$') {
              return @(
                "- $Title ($Suite): Skipped"
                "   Report says skipped"
                ""
              )
            }

            $status = 'Failed'
            $total = $null
            $failed = $null

            if ($content -match 'Completed:\s*All\s*(\d+)\s*tests\s*were\s*successful\.') {
              $status = 'Completed'
              $total = $Matches[1]
              $failed = 0
            }
            elseif ($content -match 'Failed\s*(\d+)\/(\d+)\s*tests') {
                $status = 'Completed'
              $failed = $Matches[1]
              $total = $Matches[2]
            }
            elseif (Test-Path $LogPath) {
              $logContent = Get-Content $LogPath -Raw -ErrorAction SilentlyContinue
              if ($logContent -match 'Failed\s*(\d+)\/(\d+)\s*tests') {
                $status = 'Completed'
                $failed = $Matches[1]
                $total = $Matches[2]
              }
            }

            $icon = if ($status -eq 'Completed') { '*' } else { 'X' }
            $lines = @("$icon $Title ($Suite): $status")
            if ($null -ne $total) { $lines += "   No of tests: $total" }
            if ($null -ne $failed) { $lines += "   Failed: $failed" }
            $lines += ""
            return $lines
          }

          $summaryLines = New-Object System.Collections.Generic.List[string]
          $summaryLines.Add("## Windows Test Summary")
          $summaryLines.Add("")
          foreach ($line in (Get-MtrBlock -Title 'Main MTR' -Suite $suiteLabel -ReportPath $reportPath -LogPath $logPath)) {
            [void]$summaryLines.Add($line)
          }

          $summaryLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          
      - name: Artifact Organization
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          Remove-Item -Recurse -Force artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path `
            artifacts/test-reports, `
            artifacts/summaries, `
            artifacts/logs, `
            artifacts/packages | Out-Null
          $root = $env:GITHUB_WORKSPACE
          
          # Test reports
          Get-ChildItem -Path $root -Filter 'mtr_*.xml' -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts/test-reports -Force
            
          # Summaries
          Get-ChildItem -Path $root -Filter 'build-error*.txt' -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts/summaries -Force
            
          # Logs
          Get-ChildItem -Path $root -Filter 'mtr_*.err' -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts/logs -Force
            
          # Packages
          Get-ChildItem -Path (Join-Path $root 'bld') -Recurse -File -Include *.tar.gz, *.tgz, *.zip -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts/packages -Force
            
      - name: Artifact Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-ci-artifacts
          if-no-files-found: ignore
          path: artifacts/

  auto-merge:
    needs:
      - linux-workflow
      - windows-workflow

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --merge \
            --delete-branch
