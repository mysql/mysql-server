 # MySQL Server Instance Configuration File
 # ----------------------------------------------------------------------
 # Generated by the MySQL Server Instance Configuration Wizard
 #
 #
 # Installation Instructions
 # ----------------------------------------------------------------------
 #
 # On Linux you can copy this file to /etc/my.cnf to set global options,
 # mysql-data-dir/my.cnf to set server-specific options
 # (@localstatedir@ for this installation) or to
 # ~/.my.cnf to set user-specific options.
 #
 # On Windows you should keep this file in the installation directory 
 # of your server (e.g. C:\Program Files\MySQL\MySQL Server X.Y). To
 # make sure the server reads the config file use the startup option 
 # "--defaults-file". 
 #
 # To run run the server from the command line, execute this in a 
 # command line shell, e.g.
 # mysqld --defaults-file="C:\Program Files\MySQL\MySQL Server X.Y\my.ini"
 #
 # To install the server as a Windows service manually, execute this in a 
 # command line shell, e.g.
 # mysqld --install MySQLXY --defaults-file="C:\Program Files\MySQL\MySQL Server X.Y\my.ini"
 #
 # And then execute this in a command line shell to start the server, e.g.
 # net start MySQLXY
 #
 #
 # Guildlines for editing this file
 # ----------------------------------------------------------------------
 #
 # In this file, you can use all long options that the program supports.
 # If you want to know the options a program supports, start the program
 # with the "--help" option.
 #
 # More detailed information about the individual options can also be
 # found in the manual.
 #
 #
 # CLIENT SECTION
 # ----------------------------------------------------------------------
 #
 # The following options will be read by MySQL client applications.
 # Note that only client applications shipped by MySQL are guaranteed
 # to read this section. If you want your own MySQL client program to
 # honor these values, you need to specify it as an option during the
 # MySQL client library initialization.
 #
 [client]
 
 port=3306
 
 [mysql]
 
 default-character-set=latin1
 
 
 # SERVER SECTION
 # ----------------------------------------------------------------------
 #
 # The following options will be read by the MySQL Server. Make sure that
 # you have installed the server correctly (see above) so it reads this 
 # file.
 #
 [mysqld]
 
 #The TCP/IP Port the MySQL Server will listen on
 port=3306
 
 #
 max_allowed_packet=1G
 
 
 #Path to installation directory. All paths are usually resolved relative to this.
 basedir="/opt/InfoVista/5ViewOC"
 
 #Path to the database root
 datadir="/opt/InfoVista/5ViewOC/mysql/data"
 
 # The default character set that will be used when a new schema or table is
 # created and no character set is defined
 default-character-set=latin1
 
 # The default storage engine that will be used when create new tables when
 default-storage-engine=myisam
 
 # Set the SQL mode to strict
 sql-mode="STRICT_TRANS_TABLES,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION"
 
 # The maximum amount of concurrent sessions the MySQL server will
 # allow. One of these connections will be reserved for a user with
 # SUPER privileges to allow the administrator to login even if the
 # connection limit has been reached.
 max_connections=100
 
 # Query cache is used to cache SELECT results and later return them
 # without actual executing the same query once again. Having the query
 # cache enabled may result in significant speed improvements, if your
 # have a lot of identical queries and rarely changing tables. See the
 # "Qcache_lowmem_prunes" status variable to check if the current value
 # is high enough for your load.
 # Note: In case your tables change very often or if your queries are
 # textually different every time, the query cache may result in a
 # slowdown instead of a performance improvement.
 query_cache_size=0
 
 # The number of open tables for all threads. Increasing this value
 # increases the number of file descriptors that mysqld requires.
 # Therefore you have to make sure to set the amount of open files
 # allowed to at least 4096 in the variable "open-files-limit" in
 # section [mysqld_safe]
 table_cache=256
 
 # Maximum size for internal (in-memory) temporary tables. If a table
 # grows larger than this value, it is automatically converted to disk
 # based table This limitation is for a single table. There can be many
 # of them.
 tmp_table_size=18M
 
 
 # How many threads we should keep in a cache for reuse. When a client
 # disconnects, the client's threads are put in the cache if there aren't
 # more than thread_cache_size threads from before.  This greatly reduces
 # the amount of thread creations needed if you have a lot of new
 # connections. (Normally this doesn't give a notable performance
 # improvement if you have a good thread implementation.)
 thread_cache_size=8
 
 #*** MyISAM Specific options
 
 # The maximum size of the temporary file MySQL is allowed to use while
 # recreating the index (during REPAIR, ALTER TABLE or LOAD DATA INFILE.
 # If the file-size would be bigger than this, the index will be created
 # through the key cache (which is slower).
 myisam_max_sort_file_size=100G
 
 # If the temporary file used for fast index creation would be bigger
 # than using the key cache by the amount specified here, then prefer the
 # key cache method.  This is mainly used to force long character keys in
 # large tables to use the slower key cache method to create the index.
 myisam_max_extra_sort_file_size=100G
 
 # If the temporary file used for fast index creation would be bigger
 # than using the key cache by the amount specified here, then prefer the
 # key cache method.  This is mainly used to force long character keys in
 # large tables to use the slower key cache method to create the index.
 myisam_sort_buffer_size=35M
 
 # Size of the Key Buffer, used to cache index blocks for MyISAM tables.
 # Do not set it larger than 30% of your available memory, as some memory
 # is also required by the OS to cache rows. Even if you're not using
 # MyISAM tables, you should still set it to 8-64M as it will also be
 # used for internal temporary disk tables.
 key_buffer_size=128M
 
 # Size of the buffer used for doing full table scans of MyISAM tables.
 # Allocated per thread, if a full scan is needed.
 read_buffer_size=64K
 read_rnd_buffer_size=256K
 
 # This buffer is allocated when MySQL needs to rebuild the index in
 # REPAIR, OPTIMZE, ALTER table statements as well as in LOAD DATA INFILE
 # into an empty table. It is allocated per thread so be careful with
 # large settings.
 sort_buffer_size=256K

 # ----------------------------------------------------------------------
 # InnoDB options.
 # ----------------------------------------------------------------------

 innodb_data_home_dir="/opt/InfoVista/5ViewOC/mysql/data"
 innodb_data_file_path=ibdata1:10M:autoextend
 innodb_log_group_home_dir="/opt/InfoVista/5ViewOC/mysql/data"
 innodb_buffer_pool_size=16M
 innodb_additional_mem_pool_size=2M
 innodb_log_file_size=5M
 innodb_log_buffer_size=8M
 innodb_flush_log_at_trx_commit=1
 innodb_lock_wait_timeout=50

 # ----------------------------------------------------------------------
 # Sparrow options.
 # ----------------------------------------------------------------------

 # Maximum number of files opened simultaneously in Sparrow.
 sparrow_open_files=500

 # Default maximum lifetime of data in a table, in days. When this lifetime is reached, older data are purged.
 sparrow_default_max_lifetime=365
 
 # Percentage applied to the number of records in range, in order to favor index scans over table scans. Default is 50%: twice less records in range than computed.
 sparrow_index_cost_percentage=50

 # Maximum disk size used by all Sparrow tables. If 0, all disk space except a security margin of 100MB may be used.
 sparrow_max_disk_size=100G

 # Block size used when reading data files (one block per system call).
 sparrow_data_read_block_size=4K
 
 # Block size used when reading index files (one block per system call).
 sparrow_index_read_block_size=1M
 
 # Block size used when reading master and status files (one block per system call).
 sparrow_read_block_size=64K
  
 # Block size used when writing files (one block per system call).
 sparrow_write_block_size=16M
 
 # Block size used when reading data from the network.
 sparrow_transfer_block_size=1M
 
 # Size of the socket buffer used to send data.
 sparrow_socket_sndbuf_size=2048
 
 # Size of the socket buffer used to receive data.
 sparrow_socket_rcvbuf_size=1M

 # Block size used when caching data.
 sparrow_cache_block_size=8K
 
 # Size of level 0 cache. This cache level contains data read recently but not yet used.
 sparrow_cache0_size=256M
 
 # Size of level 1 cache. This cache level contains meta data and index records from recent queries.
 sparrow_cache1_size=256M
 
 # Size of level 2 cache. This cache level contains data records from recent queries.
 sparrow_cache2_size=256M
 
 # Size of level 3 cache. This cache level contains data records from recent inserts.
 sparrow_cache3_size=256M

 # When no WHERE condition is specified for the timestamp, use this default time period (in seconds)
 # before current time.
 # For tests: if set to 0 (allowed only in debug mode), all time partitions are selected.
 sparrow_default_time_period=86400
 
 # Number of worker threads.
 sparrow_worker_threads=2
 
 # Number of writer threads.
 sparrow_writer_threads=1

 # Number of worker threads for DNS resolution.
 sparrow_dns_worker_threads=1
 
 # Number of threads used for online table modifications.
 sparrow_alter_threads=1
 
 # If false, partition coalescing is disabled. It is enabled by default.
 sparrow_coalescing=1
 
 # Number of threads used for partition coalescing.
 sparrow_coalescing_threads=1
 
 # Maximum size of the tuple buffer. When this buffer is full, insertions are blocked until a flush occurs.
 sparrow_max_tuple_buffer_size=64M

 # Threshold, in percentage of sparrow_max_tuple_buffer_size, above which data are flushed to disk.
 sparrow_tuple_buffer_threshold=50

 # Interval, in seconds, between data flushes. Data may be written more often if the maximum number of
 # buffered tuples is reached before this time interval elapses.
 # For tests: if set to 0 (allowed only in debug mode), data are never flushed.
 sparrow_flush_interval=300
 
 # Maximum size used when generating the tree holding index values. There is one tree in each data and index file. If set to 0, there is no maximum size.
 sparrow_index_tree_size=0
 
 # TCP port on which Sparrow binds its listener socket.
 sparrow_listener_port=11000
 
 # Local address on which Sparrow binds its listener socket.
 sparrow_listener_address=
 
 # Maximum number of simultaneous connections on Sparrow.
 sparrow_max_connections=50
 
 # Action taken when an existing table is detected upon initialization, but with incompatible columns.
 # If drop, the existing table is dropped.
 # If rename, the existing table is renamed to xxx_YYYYMMDDHHmmSS, where xxx is the name of the Sparrow table and
 # YYYYMMDDHHmmSS the timestamp of the detection.
 sparrow_incompatible_table=drop
 
 # Unix only: disk sector size of the partition where the database resides.
 sparrow_disk_sector_size=512

 # Maximum size of the DNS cache.
 sparrow_max_dns_cache_size=64M

 # Default DNS query timeout, in milliseconds.
 sparrow_dns_timeout=200

 # Default maximum number of retries when a query times out. If multiple servers are available for the query, the retry is performed on the next server.
 sparrow_dns_retries=2

 # Additional file systems for Sparrow data and index files.
 sparrow_filesystems=
